name: Extension release package
on:
  push:
    branches: [design/locked-red-n-branding]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: navorika-chrome-extension-v1.1.0
          path: dist/navorika-chrome-extension-v1.1.0.zip
          if-no-files-found: error
